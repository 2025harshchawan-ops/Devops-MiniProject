<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Canteen Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #ff6b6b; }
        .main-container { display: flex; justify-content: space-around; max-width: 900px; margin: 0 auto; gap: 20px; }
        .menu, .cart { background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); width: 45%; }
        .item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        button { background-color: #28a745; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #218838; }
        .total-section { font-weight: bold; margin-top: 15px; font-size: 18px; text-align: right; }
    </style>
</head>
<body>

    <h1>Campus QuickBites Canteen</h1>

    <div class="main-container">
        <!-- Left Side: Menu -->
        <div class="menu">
            <h3>Menu</h3>
            <div class="item">
                <span>Masala Chai - ₹20</span>
                <button onclick="addItem('Masala Chai', 20)">Add</button>
            </div>
            <div class="item">
                <span>Veg Burger - ₹60</span>
                <button onclick="addItem('Veg Burger', 60)">Add</button>
            </div>
            <div class="item">
                <span>Cheese Sandwich - ₹50</span>
                <button onclick="addItem('Cheese Sandwich', 50)">Add</button>
            </div>
        </div>

        <!-- Right Side: Cart / Order Summary -->
        <div class="cart">
            <h3>Your Order</h3>
            <ul id="cartItems">
                <li>Cart is empty</li>
            </ul>
            <div class="total-section">
                Total: ₹<span id="totalPrice">0</span>
            </div>
            <button id="orderBtn" style="width:100%; margin-top:15px; background:#007bff;" onclick="alert('Order Placed Successfully!')">Checkout</button>
        </div>
    </div>

    <script>
        let total = 0;
        let cartList = document.getElementById("cartItems");
        let totalPriceElem = document.getElementById("totalPrice");
        let isFirstItem = true;

        function addItem(name, price) {
            if (isFirstItem) {
                cartList.innerHTML = ""; // Clear "Cart is empty" message
                isFirstItem = false;
            }
            let li = document.createElement("li");
            li.innerText = `${name} - ₹${price}`;
            cartList.appendChild(li);

            total += price;
            totalPriceElem.innerText = total;
        }
    </script>
</body>
</html>
